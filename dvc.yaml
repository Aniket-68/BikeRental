stages:
  ingest:
    cmd: python src/ingest.py

    deps:
      - src/ingest.py
      - src/validation.py
      - data/raw/hour.csv
      - requirements.txt

    outs:
      - data/interim/validated.csv

  prepare:
    cmd: python src/prepare.py

    deps:
      - src/prepare.py
      - src/features.py
      - src/split_data.py
      - data/interim/validated.csv
      - requirements.txt

    # DVC tracks this directory and all three generated CSV files.
    outs:
      - data/processed
